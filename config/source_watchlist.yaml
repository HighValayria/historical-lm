active_sources:
  - name: authoritative event and discovery chronologies
    category: chronology_evidence
    priority: high
  - name: standards and institutional history records
    category: institution_and_policy_dates
    priority: high
  - name: dated primary publications with stable identifiers
    category: primary_attestation
    priority: high
  - name: history-of-science and concept-history scholarship
    category: independent_chronology_review
    priority: high
  - name: temporal QA and knowledge-editing datasets
    category: benchmark_candidate
    priority: high
  - name: corpora with event time and publication time metadata
    category: temporal_retrieval_corpus
    priority: high

legacy_sources:
  status: on_demand_only
  activation_rule: direct_support_for_chronology_card_or_method_stress_test
  entries:
    - Wellcome Collection
    - China Medical Missionary Journal
    - Chinese Maritime Customs medical reports
    - Shanghai Municipal Council reports
    - bnAsie
    - Shen Bao
    - Late Qing periodical databases

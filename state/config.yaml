project:
  name: "LLM Historical Anachronism"
  primary_problem: "historical and temporal anachronism in language models"
  contribution_target: "model or system method"
  fixed_period: null
  fixed_domain: null
  legacy_scenarios:
    - "late-Qing public health"
  candidate_methods:
    - "time-conditioned parameter adaptation"
    - "temporal or historical RAG"
    - "anachronism verification agent"

run:
  mode: "research_and_method_feasibility"
  ask_for_confirmation_between_nodes: false
  allow_dynamic_nodes: true
  max_dynamic_nodes: 12
  continue_after_blocker: true
  require_git_commits: true
  backlog_path: "state/research_backlog.json"
  execution_state_path: "state/research_execution_state.json"

automation:
  timezone: "Asia/Shanghai"
  stage_order: [daily, tactical, synthesis, audit]
  intervals_days:
    daily: 1
    tactical: 3
    synthesis: 7
    audit: 14
  max_tasks_per_daily_run: 3
  max_total_minutes_per_daily_run: 90
  manual_update_schedule_default: false
  success_required_to_advance_schedule: true

budgets:
  large_model_training_allowed: false
  paid_external_model_api_allowed: false
  bypass_access_controls_allowed: false
  exhaustive_web_scraping_allowed: false
  model_calls_during_framework_tests: 0
  large_downloads_during_framework_tests: false

candidate_scoring:
  dimensions:
    - anachronism_error_coverage
    - method_novelty
    - causal_evaluation_clarity
    - data_and_chronology_feasibility
    - compute_and_interface_feasibility
    - reproducibility
    - value_if_results_are_negative
  scale_min: 1
  scale_max: 5

stopping:
  no_material_new_findings_rounds: 3
  stop_if_access_is_prohibited: true
  stop_if_evidence_is_sufficient_for_decision: true

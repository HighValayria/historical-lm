run_id: exploration-002-proposed
objective: >
  将第一轮 seed benchmark 扩展为带真实史料段落支撑的试点评测集，
  并在不训练模型、不调用付费 API 的条件下比较普通提示、直接提供来源和本地轻量检索。

nodes:
  N00:
    title: 核查来源使用条款与段落抽取计划
    depends_on: []
    objective: 在抽取段落前复核 Wellcome、CRL 与 bnAsie 条款。
    expected_artifacts:
      - reports/next/source_use_review.md
    completion_criteria:
      - 每个候选来源都有访问与复用说明。
    stopping_criteria:
      - 如果条款禁止目标用途，停止使用该来源。

  N01:
    title: 抽取可核验试点段落
    depends_on: [N00]
    objective: 从许可兼容来源抽取 4—8 条短段落。
    expected_artifacts:
      - data/processed/pilot_passages.jsonl
      - reports/next/passage_extraction_report.md
    completion_criteria:
      - 至少 4 条段落具备完整元数据。
    stopping_criteria:
      - 如果没有来源允许合法抽取，则停止。

  N02:
    title: 测试 PDF/OCR 质量
    depends_on: [N00]
    objective: 对 Wellcome 与 bnAsie 候选 PDF 做小样本文本抽取。
    expected_artifacts:
      - reports/next/ocr_quality_report.md
    completion_criteria:
      - 至少两个来源条目完成 OCR/文本质量分级。
    stopping_criteria:
      - 条款或质量不满足时停止批量化。

  N03:
    title: 扩展 passage-grounded benchmark
    depends_on: [N01]
    objective: 添加真实段落支撑的事实、词汇、因果、价值和归因题目。
    expected_artifacts:
      - benchmarks/pilot/pilot_items_v0_2.jsonl
    completion_criteria:
      - 至少 20 条题目，其中至少 8 条由真实段落支撑。
    stopping_criteria:
      - 如果标签无法稳定应用，先修订指南。

  N04:
    title: 标注一致性干运行
    depends_on: [N03]
    objective: 检查时代错置标签是否可稳定使用。
    expected_artifacts:
      - reports/next/annotation_dry_run.md
    completion_criteria:
      - 主要分歧类型被记录并修订指南。
    stopping_criteria:
      - 核心标签持续模糊时停止扩展。

  N05:
    title: 增加来源类型感知检索与日期权威路由
    depends_on: [N03]
    objective: 改进 T51 原型，避免截止日期控制题错误检索历史来源。
    expected_artifacts:
      - prototypes/min_engineering_probe/probe_v0_2.py
    completion_criteria:
      - 原型能验证扩展 benchmark 并按题型路由。
    stopping_criteria:
      - 字段不足时先更新 schema。

  N06:
    title: 无训练条件下的提示/来源/RAG 比较
    depends_on: [N03, N05]
    objective: 比较普通提示、直接提供来源和本地检索条件。
    expected_artifacts:
      - reports/next/no_training_comparison.md
    completion_criteria:
      - 至少 10 条题目在至少两种条件下完成评估。
    stopping_criteria:
      - 不进行付费 API 调用或大规模训练。

  N07:
    title: 中文来源授权访问评估
    depends_on: []
    objective: 判断《申报》、晚清期刊或方志全文能否合法使用。
    expected_artifacts:
      - reports/next/chinese_source_access_assessment.md
    completion_criteria:
      - 每个候选中文来源被分类为授权、仅手工、阻塞或未知。
    stopping_criteria:
      - 不绕过认证、付费墙、验证码或禁止批量下载规则。

  N08:
    title: 公共卫生词汇时代错置术语表
    depends_on: [N01, N07]
    objective: 建立 `weisheng`、检疫、接种、鼠疫、卫生等词的来源见证表。
    expected_artifacts:
      - evidence/term_registry.md
    completion_criteria:
      - 至少 10 个术语或词义具备来源状态记录。
    stopping_criteria:
      - 无一手见证时停止该词条。

  N09:
    title: 下一轮综合与试点报告
    depends_on: [N02, N04, N06]
    objective: 综合段落抽取、OCR、标注一致性和无训练评测结果。
    expected_artifacts:
      - reports/next/PILOT_REPORT.md
    completion_criteria:
      - 下一步研究决策有证据支撑。
    stopping_criteria:
      - 证据足够或所有数据路线阻塞时停止。
